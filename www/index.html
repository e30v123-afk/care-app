<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أولوية العناية</title>
<style>
  :root { --pink:#d4768f; --ink:#1a1a1a; --ink-2:#6b6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:#fff; color:var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:32px; text-align:center;
    font:16px/1.7 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  }
  .mark { width:92px; height:92px; }
  h1 { margin:4px 0 0; font-size:21px; font-weight:800; }
  p { margin:0; color:var(--ink-2); font-size:14.5px; max-width:310px; }
  button {
    margin-top:8px; background:var(--pink); color:#fff; border:0; border-radius:13px;
    padding:13px 34px; font:700 15.5px inherit;
  }
  button:active { transform:scale(.97); }
  .hint { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); font-size:12.5px; color:#a3a3a3; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 8.6c1.6-2 3.4-3 5-3 2 0 3.4 1.3 3.4 3 0 3.6-4 8.8-8.4 8.8S3.6 12.2 3.6 8.6c0-1.7 1.4-3 3.4-3 1.6 0 3.4 1 5 3z"/>
  </svg>
  <h1>أولوية العناية</h1>
  <p>تعذّر الوصول إلى المتجر. تأكدي من اتصالك بالإنترنت ثم أعيدي المحاولة.</p>
  <button type="button" onclick="location.replace('https://careksa.com/')">إعادة المحاولة</button>
  <div class="hint">شركة أولوية العناية التجارية</div>
<script>
  addEventListener('online', function () { location.replace('https://careksa.com/'); });
  setTimeout(function () { if (navigator.onLine) location.replace('https://careksa.com/'); }, 2500);
</script>
</body>
</html>
